name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # For the concurrent experiment-status test (SELECT ... FOR UPDATE).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faithtrace
          POSTGRES_PASSWORD: faithtrace
          POSTGRES_DB: faithtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faithtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          FAITHTRACE_TEST_PG_URL: postgresql+psycopg2://faithtrace:faithtrace@localhost:5432/faithtrace_test
        run: pytest -q -rs

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
