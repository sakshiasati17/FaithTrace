version: "3.9"

services:

  # ─── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faithtrace
      POSTGRES_PASSWORD: faithtrace
      POSTGRES_DB: faithtrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithtrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── Backend ────────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      # Only the API container runs Alembic migrations on startup
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker-ingestion:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    command: celery -A app.workers.tasks.celery_app worker -Q ingestion -c 4 --loglevel=info

  worker-experiments:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - ./eval_sets:/app/eval_sets
    command: celery -A app.workers.tasks.celery_app worker -Q experiments,evaluation,diagnostics -c 2 --loglevel=info

  # ─── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  # ─── NVIDIA Triton Inference Server (optional, requires NVIDIA GPU) ──────────
  # To enable: uncomment this block and ensure the host has NVIDIA drivers + nvidia-container-toolkit.
  # triton:
  #   image: nvcr.io/nvidia/tritonserver:24.01-py3
  #   container_name: faithtrace-triton
  #   ports:
  #     - "8010:8000"   # HTTP
  #     - "8011:8001"   # gRPC
  #     - "8012:8002"   # Prometheus metrics
  #   volumes:
  #     - ./backend/app/optimization/triton_config:/models
  #   command: tritonserver --model-repository=/models --strict-model-config=false
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  storage_data:
