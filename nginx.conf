events {
    worker_connections 1024;
}

http {
    # ─── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── Rate limiting zones ────────────────────────────────────────────────────
    # General API: 30 req/s per IP with burst allowance
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=30r/s;
    # Upload endpoint: 5 req/min per IP (heavier operation)
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

    # ─── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";

    # ─── Upload size (must match MAX_UPLOAD_SIZE_MB in backend) ─────────────────
    client_max_body_size 60M;

    # ─── HTTPS — uncomment to enable TLS in production ──────────────────────────
    # Steps:
    #   1. Point your domain DNS to this server's IP
    #   2. Install certbot: apt install certbot python3-certbot-nginx
    #   3. Run: certbot --nginx -d yourdomain.com
    #   Certbot will auto-add ssl_certificate lines and reload nginx.
    #
    # Redirect HTTP → HTTPS:
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
    #
    # HTTPS block:
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     # ... paste the location blocks below here
    # }

    server {
        listen 80;
        server_name _;

        # ─── Upload endpoint — stricter rate limit ────────────────────────────
        location /api/v1/corpus/upload {
            limit_req        zone=upload_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000/api/v1/corpus/upload;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ─── API ─────────────────────────────────────────────────────────────
        location /api/ {
            limit_req        zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Health check (no rate limit, no auth required) ──────────────────
        location /health {
            proxy_pass http://api:8000/health;
        }

        # ─── Frontend ─────────────────────────────────────────────────────────
        location / {
            proxy_pass       http://frontend:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}
